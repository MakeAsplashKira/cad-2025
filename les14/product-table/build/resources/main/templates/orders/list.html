<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список заказов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2 class="mb-3">Список заказов — Зоомагазин</h2>

<div class="mb-2 text-muted small">
    Вы вошли как: <strong sec:authentication="name"></strong>
    &nbsp;|&nbsp;
    <a th:href="@{/logout}">Выйти</a>
</div>

<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<a sec:authorize="hasRole('MANAGER')" th:href="@{/orders/new}" class="btn btn-primary mb-3">Создать заказ</a>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Клиент</th>
        <th>Дата</th>
        <th>Сумма</th>
        <th>Статус</th>
        <th>Адрес доставки</th>
        <th sec:authorize="hasRole('MANAGER')">Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="order : ${orders}">
        <td th:text="${order.orderId}"></td>
        <td th:text="${order.customer.name}"></td>
        <td th:text="${#temporals.format(order.orderDate, 'dd.MM.yyyy HH:mm')}"></td>
        <td th:text="${order.totalPrice} + ' ₽'"></td>
        <td th:text="${order.status}"></td>
        <td th:text="${order.shippingAddress}"></td>
        <td sec:authorize="hasRole('MANAGER')">
            <a th:href="@{/orders/{id}/edit(id=${order.orderId})}" class="btn btn-sm btn-warning">Изменить</a>
            <form th:action="@{/orders/{id}/delete(id=${order.orderId})}" method="post" style="display:inline">
                <button type="submit" class="btn btn-sm btn-danger"
                        onclick="return confirm('Удалить заказ?')">Удалить</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(orders)}">
        <td colspan="7" class="text-center text-muted">Заказов пока нет</td>
    </tr>
    </tbody>
</table>

</body>
</html>
