<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новый заказ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Создать заказ</h2>

<form th:action="@{/orders}" method="post">
    <div class="mb-3">
        <label class="form-label fw-bold">Клиент</label>
        <select name="customerId" class="form-select" required>
            <option value="">-- Выберите клиента --</option>
            <option th:each="c : ${customers}"
                    th:value="${c.customerId}"
                    th:text="${c.name} + ' (' + ${c.email} + ')'"></option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label fw-bold">Адрес доставки</label>
        <input type="text" name="shippingAddress" class="form-control" required
               placeholder="Введите адрес доставки">
    </div>

    <h5 class="mt-4">Товары</h5>
    <div th:each="i : ${#numbers.sequence(0, 2)}" class="row mb-2 g-2">
        <div class="col-8">
            <select name="productIds" class="form-select">
                <option value="0">-- Не выбрано --</option>
                <option th:each="p : ${products}"
                        th:value="${p.productId}"
                        th:text="${p.name} + ' — ' + ${p.price} + ' ₽'"></option>
            </select>
        </div>
        <div class="col-4">
            <input type="number" name="quantities" class="form-control" value="1" min="1" placeholder="Кол-во">
        </div>
    </div>

    <div class="mt-3">
        <button type="submit" class="btn btn-success">Создать заказ</button>
        <a th:href="@{/orders}" class="btn btn-secondary ms-2">Отмена</a>
    </div>
</form>

</body>
</html>
