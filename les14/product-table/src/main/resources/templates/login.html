<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход — Зоомагазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 420px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h2 class="card-title mb-4 text-center">Зоомагазин</h2>
            <h5 class="mb-3 text-muted text-center">Вход в систему</h5>

            <div th:if="${param.error}" class="alert alert-danger">
                Неверное имя пользователя или пароль
            </div>
            <div th:if="${param.logout}" class="alert alert-info">
                Вы успешно вышли из системы
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Пользователь</label>
                    <input type="text" id="username" name="username"
                           class="form-control" required autofocus placeholder="user или manager">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Пароль</label>
                    <input type="password" id="password" name="password"
                           class="form-control" required placeholder="password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>

            <hr class="my-3">
            <div class="text-muted small">
                <p class="mb-1"><strong>user</strong> / password — просмотр заказов</p>
                <p class="mb-0"><strong>manager</strong> / password — все операции</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
