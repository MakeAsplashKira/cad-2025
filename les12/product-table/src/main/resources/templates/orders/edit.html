<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать заказ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Редактировать заказ #<span th:text="${order.orderId}"></span></h2>

<form th:action="@{/orders/{id}(id=${order.orderId})}" method="post">
    <div class="mb-3">
        <label class="form-label fw-bold">Клиент</label>
        <input type="text" class="form-control" th:value="${order.customer.name}" disabled>
    </div>

    <div class="mb-3">
        <label class="form-label fw-bold">Статус</label>
        <select name="status" class="form-select">
            <option value="NEW" th:selected="${order.status == 'NEW'}">NEW — Новый</option>
            <option value="PROCESSING" th:selected="${order.status == 'PROCESSING'}">PROCESSING — В обработке</option>
            <option value="SHIPPED" th:selected="${order.status == 'SHIPPED'}">SHIPPED — Отправлен</option>
            <option value="DELIVERED" th:selected="${order.status == 'DELIVERED'}">DELIVERED — Доставлен</option>
            <option value="CANCELLED" th:selected="${order.status == 'CANCELLED'}">CANCELLED — Отменён</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label fw-bold">Адрес доставки</label>
        <input type="text" name="shippingAddress" class="form-control"
               th:value="${order.shippingAddress}" required>
    </div>

    <div class="mt-3">
        <button type="submit" class="btn btn-success">Сохранить</button>
        <a th:href="@{/orders}" class="btn btn-secondary ms-2">Отмена</a>
    </div>
</form>

</body>
</html>
