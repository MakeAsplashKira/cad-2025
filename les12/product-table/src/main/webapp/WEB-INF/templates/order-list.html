<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Orders</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        button { padding: 5px 10px; margin: 2px; }
    </style>
</head>
<body>
<h1>Order List</h1>
<a href="/web/orders/create"><button>Create New Order</button></a>

<table>
    <thead>
    <tr>
        <th>ID</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th><th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="order : ${orders}">
        <td th:text="${order.orderId}">1</td>
        <td th:text="${order.customer.name}">Customer</td>
        <td th:text="${order.orderDate}">Date</td>
        <td th:text="${order.totalPrice}">0.00</td>
        <td th:text="${order.status}">NEW</td>
        <td>
            <a th:href="@{/web/orders/edit/{id}(id=${order.orderId})}">Edit</a>
            <a th:href="@{/web/orders/delete/{id}(id=${order.orderId})}"
               onclick="return confirm('Delete order?')">Delete</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
